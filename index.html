<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOCK OPNAME FISIK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 420px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #0002;
}
h2 {
  text-align: center;
  color: #123b68;
}
.subtitle {
  text-align: center;
  color: #555;
  font-size: 14px;
}
input, button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  box-sizing: border-box;
  border-radius: 6px;
}
input {
  border: 1px solid #ccc;
}
button {
  background: #155e36;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  opacity: .6;
}
#message {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
  <h2>STOCK OPNAME FISIK</h2>
  <p class="subtitle">Mahkamah Syar'iyah Lhoksukon</p>

  <form id="loginForm">
    <input
      type="email"
      id="email"
      placeholder="Masukkan email terdaftar"
      required
    >
    <input
      type="password"
      id="password"
      placeholder="Masukkan password"
      required
    >
    <button type="submit" id="loginButton">LOGIN</button>
  </form>

  <div id="message"></div>
</div>

<script>
const SUPABASE_URL = "https://wcrzuphpxypmzeaigqbt.supabase.co";
const SUPABASE_KEY = "sb_publishable_jVpX6eX9oIciM3aeKg8jqw_9lo59myK";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

loginForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  loginButton.disabled = true;
  message.textContent = "Sedang memproses login...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = "Login gagal: " + error.message;
    loginButton.disabled = false;
    return;
  }

  message.textContent = "Login berhasil. Selamat datang!";
  loginButton.disabled = false;
});
</script>

</body>
</html>
